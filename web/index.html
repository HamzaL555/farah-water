<!DOCTYPE html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Farah Su Şirkəti — İdarə paneli</title>
    <meta name="description" content="Farah Su Şirkəti idarə paneli" />
    <meta name="theme-color" content="#0B4F6C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Farah Su" />
    <!--
      Absolute paths, because the panel is served at /admin on the API host.
      A relative "app.js" would resolve to /app.js and hit the API catch-all,
      which answers with JSON and the browser refuses to execute it.
    -->
    <link rel="icon" href="/admin/assets/logo.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/admin/assets/favicon-32.png" sizes="32x32" type="image/png" />
    <!-- What the phone shows for "Add to Home Screen". -->
    <link rel="apple-touch-icon" href="/admin/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/admin/manifest.webmanifest" />
    <link rel="stylesheet" href="/admin/styles.css?v=20261014-2" />
  </head>
  <body>
    <!-- Login ------------------------------------------------------------ -->
    <div id="login" class="login-wrap">
      <form id="login-form" class="login-card" autocomplete="on">
        <div class="login-logo"><img src="/admin/assets/logo.svg" alt="" width="72" height="72" /></div>
        <h1 class="login-title">Farah Su Şirkəti</h1>
        <p class="login-sub">İdarə paneli</p>

        <label class="field">
          <span class="field-label">İstifadəçi adı, e-mail və ya telefon</span>
          <input id="login-identifier" name="username" type="text" autocomplete="username" required />
        </label>

        <label class="field">
          <span class="field-label">Şifrə</span>
          <span class="field-wrap">
            <input id="login-password" name="password" type="password" autocomplete="current-password" required />
            <button type="button" class="eye" id="toggle-eye" aria-label="Şifrəni göstər">👁</button>
          </span>
        </label>

        <p id="login-error" class="alert alert-error" hidden></p>
        <button id="login-submit" class="btn btn-primary btn-block" type="submit">Daxil ol</button>
      </form>
    </div>

    <!-- Shell ------------------------------------------------------------ -->
    <div id="scrim" class="scrim" hidden></div>
    <div id="shell" class="shell" hidden>
      <aside class="sidebar">
        <div class="sidebar-brand"><img src="/admin/assets/logo.svg" alt="" width="28" height="28" /> Farah</div>
        <nav id="nav" class="nav"></nav>
        <div class="sidebar-foot">
          <div id="who" class="who"></div>
          <button id="logout" class="btn btn-ghost btn-block">Çıxış</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button id="menu-toggle" class="menu-toggle" aria-label="Menyu">☰</button>
          <h2 id="page-title" class="page-title">Dashboard</h2>
          <span id="live-tag" class="live-tag" hidden></span>
          <div id="topbar-meta" class="topbar-meta"></div>
        </header>
        <section id="view" class="view"></section>
      </main>
    </div>

    <!-- Modal ------------------------------------------------------------ -->
    <div id="modal" class="modal" hidden>
      <div class="modal-card">
        <div class="modal-head">
          <h3 id="modal-title"></h3>
          <button id="modal-close" class="icon-btn" aria-label="Bağla">✕</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
        <p id="modal-error" class="alert alert-error modal-error" hidden></p>
        <div id="modal-foot" class="modal-foot"></div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="/admin/app.js?v=20261014-3"></script>
  </body>
</html>
