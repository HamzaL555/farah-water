# ---------------------------------------------------------------------------
# Node modules should be stored in the project-local .gradle cache.
# RN builds a lot of native code; keeping it out of the user profile helps.
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=false

android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Use the new architecture (Fabric/TurboModules), default in RN 0.81.
newArchEnabled=true

# Hermes is the JS engine: smaller APK and faster start-up than JSC.
hermesEnabled=true

# Use the prebuilt React Native binaries rather than compiling from source.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
