# ---------------------------------------------------------------------------
# PRODUCTION Docker Compose - Farah Water Company
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Assumes you have already created a root .env containing:
#   POSTGRES_PASSWORD, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET,
#   INITIAL_ADMIN_PASSWORD  (strongly recommended)
# ---------------------------------------------------------------------------

services:
  db:
    # Not published to the host in production: only the proxy reaches it.
    ports: []
    # Backup to disk in addition to the named volume, so a volume failure is
    # not a total data loss.
    volumes:
      - farah_pgdata:/var/lib/postgresql/data
      - ./deploy/pgdata:/var/lib/postgresql/pgdata
      - ./backend/docker-initdb:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports: []
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-farah}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-farah}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Tighten the CORS allow-list to your real origins in production.
      CORS_ORIGIN: ${CORS_ORIGIN:-https://api.example.com}
      TZ_OFFSET_MINUTES: ${TZ_OFFSET_MINUTES:-240}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      MAX_FAILED_LOGINS: ${MAX_FAILED_LOGINS:-5}
      LOCK_MINUTES: ${LOCK_MINUTES:-15}
    # Give the database time to finish recovery before the API accepts traffic.
    depends_on:
      db:
        condition: service_healthy
    restart: always

  proxy:
    image: caddy:2-alpine
    container_name: farah-proxy
    profiles: ["proxy"]
    restart: always
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # TLS certificates
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
    name: farah_caddy_data
  caddy_config:
    name: farah_caddy_config
